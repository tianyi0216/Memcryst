[project]
name = "memcryst"
version = "0.1.0"
description = "Memory crystallization for self improving LLM agents, training free PoC"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.50.0",
    "anthropic>=0.39.0",
    "sentence-transformers>=2.7.0",
    "hdbscan>=0.8.33",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "python-frontmatter>=1.1.0",
    "httpx>=0.25.0",
    "tenacity>=8.2.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.1.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["memcryst*"]
