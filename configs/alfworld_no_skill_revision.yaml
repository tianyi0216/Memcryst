# Ablation: skills are created but never revised at sleep time.
run:
  name: alfworld_no_skill_revision
  out_root: runs
model:
  name: Qwen/Qwen3-8B
  base_url: http://127.0.0.1:8000/v1
  api_key_env: OPENAI_API_KEY
  roles:
    agent: null
    writeback: null
    synth: null
    audit: null
env:
  kind: alfworld
  alfworld_data: null
  split: train
  eval_split: eval_out_of_distribution
  eval_tasks: 1
  eval_task_start: 84
  eval_every: 999
  max_steps: 30
  order_manifest: null
stream:
  num_cycles: 20
  tasks_per_cycle: 30
actor:
  mode: capability_plus_semantic
  nav_hint: 1
  wm_enforce: 1
memory:
  top_k: 4
  raw_layer: 0
  semantic_profile: 0
skills:
  top_k: 2
  refine: false
  synth_prompt: synthesize_skill_conditional
  gap_val_n: 12
  gap_val_start: 3000
  freeze_after: null
  failure_memory: 0
  min_cluster_size: 3
  m3_mode: 'off'
feedback:
  memory_return: 1
  skill_return: 1
extra_env: {}
